<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Manager ❤️</title>


<style>

body {

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #89cff0,
    #ffc1e3
    );


    font-family:
    "Segoe UI",
    sans-serif;


    display:flex;

    justify-content:center;

    align-items:center;

}



.container {


    background:
    rgba(255,255,255,.2);


    backdrop-filter:
    blur(15px);


    padding:40px;


    border-radius:30px;


    width:90%;

    max-width:700px;


    text-align:center;


}



h1 {

color:white;

}



input {

margin:15px;

}



.preview {


display:grid;

grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));


gap:15px;


}



.preview img {


width:100%;


height:180px;


object-fit:cover;


border-radius:20px;


box-shadow:
0 10px 20px rgba(0,0,0,.2);


}



.info {


background:
rgba(255,255,255,.3);


padding:20px;


border-radius:20px;


margin-top:30px;


color:white;


}



</style>

</head>



<body>



<div class="container">


<h1>
📸 عکس‌های پردیس ❤️
</h1>


<p>
۵ عکس خاطره‌انگیز انتخاب کن
</p>


<input
type="file"
id="files"
accept="image/*"
multiple
>


<div class="preview" id="preview">

</div>


<div class="info">


<p>
بعد از انتخاب عکس‌ها:
</p>


<p>
اسم فایل‌ها را به این شکل تغییر بده:
</p>


<p>
photo1.jpg<br>
photo2.jpg<br>
photo3.jpg<br>
photo4.jpg<br>
photo5.jpg
</p>


<p>
و داخل پوشه images قرار بده ❤️
</p>


</div>



</div>




<script>


const input =
document.getElementById("files");


const preview =
document.getElementById("preview");



input.addEventListener(
"change",
function(){


preview.innerHTML="";


const files =
Array.from(this.files);



files.slice(0,5)
.forEach(file=>{


const reader =
new FileReader();



reader.onload=function(e){


const img =
document.createElement("img");


img.src =
e.target.result;


preview.appendChild(img);


}



reader.readAsDataURL(file);



});


});



</script>


</body>

</html>
